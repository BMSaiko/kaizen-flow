name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      matrix: '{"os":["ubuntu-latest"],"node":[22],"python":["3.13"]}'
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Versão da tag coincide com package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - name: Criar release com notas geradas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag --title "${GITHUB_REF_NAME}"
