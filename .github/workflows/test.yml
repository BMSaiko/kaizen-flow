name: test
on:
  workflow_call:
    inputs:
      matrix:
        description: "JSON {os, node, python}: listas da matriz de testes"
        type: string
        required: true
      coverage:
        description: "Gerar relatório de cobertura (artefacto)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: package.json
      - run: python -m pip install pytest pytest-cov
      - run: node bin/kaizen.js audit .
      - run: npm test
        env:
          KAIZEN_COVERAGE: ${{ inputs.coverage && '1' || '0' }}
      - if: inputs.coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}-py${{ matrix.python }}
          path: coverage/
