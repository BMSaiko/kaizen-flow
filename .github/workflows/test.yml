name: test
on:
  workflow_call:
    inputs:
      matrix:
        description: "JSON {os, node, python}: listas da matriz de testes"
        type: string
        required: true
      coverage:
        description: "Gerar relatório de cobertura (artefacto)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: package.json
      - run: python -m pip install pytest pytest-cov
      - run: node bin/kaizen.js audit .
      - run: npm test
        env:
          KAIZEN_COVERAGE: ${{ inputs.coverage && '1' || '0' }}
      - if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}-py${{ matrix.python }}
          path: coverage/
