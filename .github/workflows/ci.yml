name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      matrix: '{"os":["ubuntu-latest","windows-latest","macos-latest"],"node":[18,22],"python":["3.10","3.13"]}'
  coverage:
    uses: ./.github/workflows/test.yml
    with:
      matrix: '{"os":["ubuntu-latest"],"node":[22],"python":["3.13"]}'
      coverage: true
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: npm audit (não bloqueante)
        continue-on-error: true
        run: |
          npm audit --omit=dev 2>&1 | tee audit.txt
          { echo '### npm audit --omit=dev'; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Smoke e2e do pacote (npm pack + init + audit)
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent | tail -n1)"
          work="$(mktemp -d)"
          cp "$tgz" "$work/"
          cd "$work"
          npm init -y >/dev/null
          npm install "./$tgz" --no-audit --no-fund
          mkdir proj && cd proj && git init -q
          ../node_modules/.bin/kaizen init
          ../node_modules/.bin/kaizen audit .
