name: ci
on:
  push:
    branches: [main]  # PRs já correm em pull_request (evita a matriz em dobro)
  pull_request:
concurrency:  # push novo num PR cancela a corrida anterior (main corre sempre até ao fim)
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      matrix: '{"os":["ubuntu-latest","windows-latest","macos-latest"],"node":[18,22],"python":["3.10","3.13"],"exclude":[{"os":"ubuntu-latest","node":22,"python":"3.13"}]}'  # essa combinação corre no job coverage
  coverage:
    uses: ./.github/workflows/test.yml
    with:
      matrix: '{"os":["ubuntu-latest"],"node":[22],"python":["3.13"]}'
      coverage: true
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: npm audit (não bloqueante)
        continue-on-error: true
        run: |
          npm audit --omit=dev 2>&1 | tee audit.txt
          { echo '### npm audit --omit=dev'; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Smoke e2e do pacote (npm pack + init + audit)
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent | tail -n1)"
          work="$(mktemp -d)"
          cp "$tgz" "$work/"
          cd "$work"
          npm init -y >/dev/null
          npm install "./$tgz" --no-audit --no-fund
          mkdir proj && cd proj && git init -q
          ../node_modules/.bin/kaizen init
          ../node_modules/.bin/kaizen audit .
      - name: Smoke da factory (demo --factory, fakes, sem rede)
        shell: bash
        run: |
          set -euo pipefail
          node bin/kaizen.js demo --factory
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ruff (config em ruff.toml)
        run: pipx run ruff==0.17.1 check .
  quality:
    # ratchet: complexidade (C901/PLR) e tipos (mypy) só descem face a quality-baseline.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: ferramentas de dev (ruff, mypy; só CI, o pacote não as traz)
        run: python -m pip install ruff==0.17.1 mypy==2.4.1
      - name: ratchet (ruff C901/PLR + mypy)
        run: python core/scripts/quality-ratchet.py
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install mypy==2.4.1
      - name: mypy --strict na lista core/scripts/strict_modules.txt
        run: python core/scripts/quality-ratchet.py --strict-lista
      - name: módulo tocado ou novo tem de ser strict (só em PR)
        if: github.event_name == 'pull_request'
        run: python core/scripts/quality-ratchet.py --diff "origin/${{ github.base_ref }}"
