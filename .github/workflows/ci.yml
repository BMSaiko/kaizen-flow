name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      matrix: '{"os":["ubuntu-latest","windows-latest","macos-latest"],"node":[18,22],"python":["3.10","3.13"]}'
  coverage:
    uses: ./.github/workflows/test.yml
    with:
      matrix: '{"os":["ubuntu-latest"],"node":[22],"python":["3.13"]}'
      coverage: true
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Smoke e2e do pacote (npm pack + init + audit)
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent | tail -n1)"
          work="$(mktemp -d)"
          cp "$tgz" "$work/"
          cd "$work"
          npm init -y >/dev/null
          npm install "./$tgz" --no-audit --no-fund
          mkdir proj && cd proj && git init -q
          ../node_modules/.bin/kaizen init
          ../node_modules/.bin/kaizen audit .
