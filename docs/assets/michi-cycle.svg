  <title id="t">michi cycle</title>
  <desc id="d">michi cycle: dr, grill, dp, da, gates, pentest, review-ciclo, pr-fase, report, reflect and commit proposal, with proof per phase, handoff per phase and a kaizen loop.</desc>
