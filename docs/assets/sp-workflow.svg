<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">SP workflow</title>
  <desc id="d">Super Prompt workflow: brainstorm, swot, grill-me and dr feed an 8-section SP that moves TODO, Doing, Done, closes with sp-fechar, and can be run by sp-fila sequentially or in parallel.</desc>
  <rect width="1200" height="720" rx="24" fill="#0f172a"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="600.0" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#f8fafc">SP workflow</text>
<text x="600.0" y="96" text-anchor="middle" font-size="20" fill="#cbd5e1">From an idea to a Super Prompt, then through its lifecycle</text>
<text x="85" y="138" text-anchor="start" font-size="16" font-weight="600" fill="#94a3b8">1. BUILD  (/sp, outside michi)</text>
<rect x="85" y="150" width="220" height="80" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="195.0" y="188.0" text-anchor="middle" font-size="22" font-weight="600" fill="#38bdf8">brainstorm</text><text x="195.0" y="212.0" text-anchor="middle" font-size="15" fill="#cbd5e1">ideas</text>
<path d="M307 190H345" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M353 190l-10-6v12z" fill="#94a3b8"/>
<rect x="355" y="150" width="220" height="80" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="465.0" y="188.0" text-anchor="middle" font-size="22" font-weight="600" fill="#38bdf8">swot</text><text x="465.0" y="212.0" text-anchor="middle" font-size="15" fill="#cbd5e1">stress-test</text>
<path d="M577 190H615" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M623 190l-10-6v12z" fill="#94a3b8"/>
<rect x="625" y="150" width="220" height="80" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="735.0" y="188.0" text-anchor="middle" font-size="22" font-weight="600" fill="#38bdf8">grill-me</text><text x="735.0" y="212.0" text-anchor="middle" font-size="15" fill="#cbd5e1">align what, why, how</text>
<path d="M847 190H885" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M893 190l-10-6v12z" fill="#94a3b8"/>
<rect x="895" y="150" width="220" height="80" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="1005.0" y="188.0" text-anchor="middle" font-size="22" font-weight="600" fill="#38bdf8">dr</text><text x="1005.0" y="212.0" text-anchor="middle" font-size="15" fill="#cbd5e1">real code paths</text>
<path d="M1005 232V262H600V282" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 290l-6-10h12z" fill="#94a3b8"/>
<rect x="200" y="290" width="800" height="90" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="600.0" y="333.0" text-anchor="middle" font-size="22" font-weight="600" fill="#a78bfa">Super Prompt: 8 fixed sections</text><text x="600.0" y="357.0" text-anchor="middle" font-size="15" fill="#cbd5e1">role · context · objective · success criteria · constraints · seams · steps · done-when</text>
<text x="85" y="420" text-anchor="start" font-size="16" font-weight="600" fill="#94a3b8">2. LIFECYCLE  (sp-new, sp-move, sp-fechar, sp-list)</text>
<rect x="85" y="432" width="220" height="80" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/><text x="195.0" y="470.0" text-anchor="middle" font-size="22" font-weight="600" fill="#94a3b8">TODO</text><text x="195.0" y="494.0" text-anchor="middle" font-size="15" fill="#cbd5e1">sp-new</text>
<path d="M307 472H345" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M353 472l-10-6v12z" fill="#94a3b8"/>
<rect x="355" y="432" width="220" height="80" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="465.0" y="470.0" text-anchor="middle" font-size="22" font-weight="600" fill="#a78bfa">Doing</text><text x="465.0" y="494.0" text-anchor="middle" font-size="15" fill="#cbd5e1">/michi SP</text>
<path d="M577 472H615" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/><path d="M623 472l-10-6v12z" fill="#94a3b8"/>
<rect x="625" y="432" width="220" height="80" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="2"/><text x="735.0" y="470.0" text-anchor="middle" font-size="22" font-weight="600" fill="#34d399">Done</text><text x="735.0" y="494.0" text-anchor="middle" font-size="15" fill="#cbd5e1">sp-fechar</text>
<text x="870" y="462" text-anchor="start" font-size="15" fill="#cbd5e1">gates + done + COMMIT file in one step</text>
<text x="870" y="486" text-anchor="start" font-size="15" fill="#cbd5e1">handoff appends ## Progresso, fresh context</text>
<text x="85" y="552" text-anchor="start" font-size="16" font-weight="600" fill="#94a3b8">3. RUN MANY  (/sp-fila)</text>
<rect x="85" y="564" width="500" height="110" rx="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="335.0" y="617.0" text-anchor="middle" font-size="22" font-weight="600" fill="#fbbf24">sequential</text><text x="335.0" y="641.0" text-anchor="middle" font-size="15" fill="#cbd5e1">one clean session per eligible SP, stops on first failure</text>
<rect x="615" y="564" width="500" height="110" rx="18" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/><text x="865.0" y="617.0" text-anchor="middle" font-size="22" font-weight="600" fill="#fbbf24">parallel  --concorrencia N</text><text x="865.0" y="641.0" text-anchor="middle" font-size="15" fill="#cbd5e1">N panes, one worktree each, watcher, nothing pushed</text>
  </g>
</svg>
